        letter-spacing="3.2" fill="#151917">NEO SU</text>
  <text x="76" y="168" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" letter-spacing="2.6"
        fill="#545C57">TAIPEI &#183; MOTOR DESIGN, GEARBOXES, CONTROL</text>

  <!-- The card used to carry "SIX BUILDS, AND HOW THEY CONNECT" over the
       eyebrow "MOTORS - GEARBOXES - CONTROL". Two problems: it was the
       catchphrase register Neo asked to be rid of, and "how they connect"
       advertised the dependency graph, which has since been deleted. The card
       now says what the site is and lists what is in it.
       Sized for the Helvetica fallback: most scrapers rasterise this without
       IBM Plex installed, and Helvetica sets wider than Plex Condensed. -->
  <text x="76" y="268" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2.8"
        fill="#1E4FD8">01</text>
