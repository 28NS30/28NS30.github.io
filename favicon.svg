<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .field { fill: #E6E9E5; }
    .line  { fill: none; stroke: #151917; stroke-width: 1.5; }
    .mark  { fill: none; stroke: #1E4FD8; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark){
      .field { fill: #141816; }
      .line  { stroke: #E4E8E3; }
      .mark  { stroke: #7BA0FF; }
    }
  </style>
  <rect class="field" width="32" height="32"/>
  <rect class="line" x="4.5" y="4.5" width="23" height="23"/>
  <path class="mark" d="M4.5 12.5 L12.5 4.5"/>
</svg>
